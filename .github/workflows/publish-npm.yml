name: Publish scoped npm packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated scoped workspace names to publish
        required: true
        default: "@hurajgor/reactotron-core-contract,@hurajgor/reactotron-core-client,@hurajgor/reactotron-react-native"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: npm install --global npm@11.5.1
      # The app pins a git dependency by SSH URL; the runner has no SSH key, so fetch it over HTTPS.
      - run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: corepack yarn install --immutable
      - run: corepack yarn build
      - run: corepack yarn package:validate
      - name: Publish selected packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          IFS=',' read -ra packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            npm publish --workspace="$package" --access public
          done
